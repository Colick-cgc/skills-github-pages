# 推送到 main 分支后自动构建并部署到 GitHub Pages（gh-pages 分支）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一次，避免并发部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 部署到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
